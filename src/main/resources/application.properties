# Layered destination config: module's own .env < root .env < real env vars.
# Later import wins, so the root file (found via MASTER_ENV_FILE, default ../.env)
# overrides this module's own .env. Both are optional - the module runs standalone
# on the ${KEY:default} values below if neither file is present.
spring.config.import=optional:file:./.env[.properties],optional:file:${MASTER_ENV_FILE:../.env}[.properties]

# Server Configuration
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${ALCHEMY_PORT:8080}

# Database Configuration - DATABASE_URL is read by alchemy.config.DatabaseUrlResolver
# (see that class for why it isn't wired through a Spring property here).

# CORS Configuration - exact origins, wildcard patterns, and LAN/PlayIt hosts are
# combined at runtime in SecurityConfig. Defaults mirror the root .env.example.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://alex-dyakin.com}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.alex-dyakin.com,http://*.playit.pub:*,http://*.with.playit.plus:*,http://*.gl.at.ply.gg:*,http://localhost:*,capacitor://localhost,https://localhost}
lan.host=${LAN_HOST:}
playit.host=${PLAYIT_HOST:}
